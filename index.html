    <!--
      Paint the colour mode before the first frame. Without this, a visitor who
      chose TRACE gets one flash of light paper on every reload, which is the
      one thing a theme toggle must never do. Kept inline and tiny on purpose:
      it has to run before the stylesheet, so it cannot be a module.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('sathwikhs.mode');
          var mode =
            stored === 'paper' || stored === 'trace'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'trace'
                : 'paper';
          var root = document.documentElement;
          root.dataset.theme = mode;
          root.style.colorScheme = mode === 'trace' ? 'dark' : 'light';
          root.style.background = mode === 'trace' ? '#0E0F11' : '#E7E8EA';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', mode === 'trace' ? '#0E0F11' : '#E7E8EA');
        } catch (e) {
          /* Storage blocked. The light palette is the default and is correct. */
        }
      })();
    </script>
